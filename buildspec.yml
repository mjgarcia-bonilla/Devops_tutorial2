version: 0.2

phases:
  pre_build:
    commands:
      - echo "Iniciando fase pre_build - Tutorial 2 DevOps"
      - python --version
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Fase build ejecutada el `date`"
      - python -m unittest -v
  post_build:
    commands:
      - echo "Fase post_build ejecutada el `date`"
artifacts:
  files:
    - '**/*'
